name: Build App (Windows & Android)

on:
  push:
    branches:
      - main # Bukti bahwa main selalu bisa dibuild. Langkah Release di bawah
             # tetap terkunci ke tag, jadi ini hanya menghasilkan artifact.
    tags:
      - "v*" # Trigger saat push tag (contoh: v1.0.0)
  workflow_dispatch: # Trigger manual

permissions:
  contents: write

jobs:
  # JOB 1: WINDOWS
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup

      - name: Compile Installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc windows\installer.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: build/windows/x64/runner/Release/LuminaraPhotobooth_Setup.exe

      - name: Release Windows
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/windows/x64/runner/Release/LuminaraPhotobooth_Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JOB 2: ANDROID (Jalan Paralel)
  build-android:
    runs-on: ubuntu-latest # Lebih cepat untuk Android daripada Windows
    steps:
      - uses: actions/checkout@v4

      # Setup Java (Wajib untuk Android Build)
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Perintah ini menggantikan 3 perintah manual Anda menjadi 1 kali jalan
      # Hasilnya akan otomatis create 3 APK: v7a (arm), v8a (arm64), x64
      - name: Build APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi

      # Upload Artifact agar bisa didownload manual di menu Actions
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-APKs
          path: build/app/outputs/flutter-apk/*.apk

      # Upload ke Release Page (Jika trigger via Tag)
      - name: Release Android
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JOB 3: iOS
  #
  # Tanpa variable IOS_ENABLED, job ini hanya mengompilasi tanpa signing —
  # gratis, tanpa akun Apple, dan justru itu yang menangkap kerusakan sungguhan:
  # plugin tanpa dukungan iOS, Podfile gagal resolve, deployment target
  # ketinggalan. Set IOS_ENABLED=true untuk menghasilkan IPA bertanda tangan;
  # saat itu secret berikut wajib ada:
  #
  #   IOS_TEAM_ID            10 karakter dari Apple Developer > Membership
  #   IOS_PROFILE_NAME       nama provisioning profile persis seperti di portal
  #   IOS_DIST_CERT_P12      sertifikat distribusi .p12, base64
  #   IOS_DIST_CERT_PASSWORD password saat .p12 diekspor
  #   IOS_PROVISIONING_PROFILE  .mobileprovision, base64
  #   APPSTORE_ISSUER_ID     App Store Connect > Integrations > Keys
  #   APPSTORE_KEY_ID        idem
  #   APPSTORE_PRIVATE_KEY   isi berkas AuthKey_XXX.p8
  #
  # base64 di macOS/Linux: base64 -i sertifikat.p12 | pbcopy
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (tanpa signing)
        if: vars.IOS_ENABLED != 'true'
        run: flutter build ios --release --no-codesign

      - name: Import Signing Certificate
        if: vars.IOS_ENABLED == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install Provisioning Profile
        if: vars.IOS_ENABLED == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      # Archive dipisah dari `flutter build ipa` bawaan supaya
      # ExportOptions.plist bisa diisi dari secret lebih dulu.
      - name: Build Signed IPA
        if: vars.IOS_ENABLED == 'true'
        run: |
          sed -i '' "s/\$(IOS_TEAM_ID)/${{ secrets.IOS_TEAM_ID }}/" ios/ExportOptions.plist
          sed -i '' "s/\$(IOS_PROFILE_NAME)/${{ secrets.IOS_PROFILE_NAME }}/" ios/ExportOptions.plist
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA Artifact
        if: vars.IOS_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: vars.IOS_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          xcrun altool --upload-app --type ios \
            --file "$(ls build/ios/ipa/*.ipa | head -1)" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
